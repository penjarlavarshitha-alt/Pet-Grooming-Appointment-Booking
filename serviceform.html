<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pet Sitting Form</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #d3d3d3;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .form-container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        width: 350px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        text-align: center;
        position: relative;
    }

    h2 {
        margin-bottom: 0;
        padding-top: 10px;
    }

    input, textarea {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    button {
        background: #f4a340;
        border: none;
        padding: 10px;
        width: 100%;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #e2952f;
    }
    label {
        display: block;
        text-align: left;
        margin: 5px 0;
        font-size: 14px;
    }

    .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-top: 5px;
    }

    .checkbox-grid label {
        text-align: left;
        font-size: 14px;
    }

    .success-msg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255,255,255,0.95);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 18px;
        color: green;
        border-radius: 15px;
        display: none;
        flex-direction: column;
    }
</style>
</head>

<body>

<div class="form-container">
    <h2>Service Request Form</h2>

    <form id="serviceForm">
        <input type="text" placeholder="Your Name" id="nameInput" required>
        <input type="tel" placeholder="Phone Number" id="phoneInput" required>
        <input type="text" placeholder="Pet Name" id="petNameInput" required>
        <input type="date" id="dateInput" required>

        <!-- SERVICES OPTIONS -->
        <p style="text-align:left; font-weight:bold; margin-top:10px;">
            Select Services:
        </p>

        <div class="checkbox-grid">
            <label><input type="checkbox" name="service" value="Provide Food"> Provide Food</label>
            <label><input type="checkbox" name="service" value="Play Time"> Play Time</label>
            <label><input type="checkbox" name="service" value="Washing / Bath"> Washing / Bath</label>
            <label><input type="checkbox" name="service" value="Walking"> Walking</label>
            <label><input type="checkbox" name="service" value="Medication Care"> Medication Care</label>
            <label><input type="checkbox" name="service" value="Grooming"> Grooming</label>
            <label><input type="checkbox" name="service" value="Nail Trimming"> Nail Trimming</label>
            <label><input type="checkbox" name="service" value="Vet Visit Assistance"> Vet Visit Assistance</label>
            <label><input type="checkbox" name="service" value="Training Basics"> Training Basics</label>
            <label><input type="checkbox" name="service" value="Overnight Stay"> Overnight Stay</label>
            <label><input type="checkbox" name="service" value="Pick-up & Drop"> Pick-up & Drop</label>
            <label><input type="checkbox" name="service" value="Special Diet Care"> Special Diet Care</label>
        </div>
        <textarea placeholder="Additional Instructions" id="instructions"></textarea>

        <button type="submit">Submit</button>
    </form>

    <div class="success-msg" id="successMsg">
        <p>Form Submitted Successfully!</p>
        <p>Redirecting to Services Page...</p>
    </div>
</div>

<script>
document.getElementById('serviceForm').addEventListener('submit', function(e){
    e.preventDefault(); // Prevent default form submission

    // Get values
    const name = document.getElementById('nameInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();
    const petName = document.getElementById('petNameInput').value.trim();
    const date = document.getElementById('dateInput').value.trim();
    const selectedServices = Array.from(document.querySelectorAll('input[name="service"]:checked'));

    // Validation
    if(!name || !phone || !petName || !date){
        alert("Please fill all required fields!");
        return;
    }

    if(selectedServices.length === 0){
        alert("Please select at least one service!");
        return;
    }

    // Show success message
    document.getElementById('serviceForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'flex';

    // Redirect after 3 seconds
    setTimeout(() => {
        window.location.href = 'services.html';
    }, 3000);
});
</script>

</body>
</html>
